<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body style="text-align:center; font-family:Arial;">
<h1>Log In</h1>

{% if form.errors %}
    <p style="color:red;">Your username and password didn't match. Please try again.</p>
{% endif %}

<form method="post" action="{% url 'login' %}" style="display:inline-block; text-align:left;">
    {% csrf_token %}

    <label for="id_username">Username</label><br>
    <input type="text" id="id_username" name="username" required><br><br>

    <label for="id_password">Password</label><br>
    <input type="password" id="id_password" name="password" required><br><br>

    <input type="hidden" name="next" value="{{ next }}">

    <button type="submit">Log In</button>
</form>

</body>
</html>
