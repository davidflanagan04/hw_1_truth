<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Course - AttendanceChimp</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 40px; }
        form { display: inline-block; text-align: left; }
        label { display: block; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>New Course</h1>
    <form action="/app/createCourse" method="post">
        {% csrf_token %}

        <label for="course-name">Course name</label>
        <input type="text" id="course-name" name="course-name" required>

        <label for="start-time">Start time</label>
        <input type="time" id="start-time" name="start-time" required>

        <label for="end-time">End time</label>
        <input type="time" id="end-time" name="end-time" required>

        <label>Days</label>
        <label><input type="checkbox" name="day-mon" value="true"> Mon</label>
        <label><input type="checkbox" name="day-tue" value="true"> Tue</label>
        <label><input type="checkbox" name="day-wed" value="true"> Wed</label>
        <label><input type="checkbox" name="day-thu" value="true"> Thu</label>
        <label><input type="checkbox" name="day-fri" value="true"> Fri</label>

        <br><br>
        <button type="submit">Create Course</button>
    </form>
</body>
</html>
